[project]
name = "agent-discord-webhook"
version = "0.1.0"
description = "Discord push notifications from local Claude Code and Codex CLI sessions"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
adw = "agent_discord_webhook.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_discord_webhook"]
